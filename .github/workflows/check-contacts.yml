name: Check contact service
on:
  pull_request:
    paths:
      - "web/contact-service/**"
      - ".github/workflows/check-contacts.yml"
  push:
    branches: [main]
    paths:
      - "web/contact-service/**"
      - ".github/workflows/check-contacts.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/contact-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/contact-service/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: "false"
